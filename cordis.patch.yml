# Inserts only this plugin's own row; no shipped DSH component is replaced.
#
# Zero-config by default: the worker generates and persists its own token on
# first activation, the controller pairs by trust-on-first-use (/fleet/hello
# discloses the token until the first claim), and workers are found by
# multicast discovery plus the controller's pinned-peer store. Set `token`
# here only to opt out of TOFU — then use the identical value on both ends.
- insert:
    - id: device-fleet
      name: dsh-device-fleet
      config:
        role: worker+controller
        host: 0.0.0.0
        port: 48791
        token: ""
        workers: []
