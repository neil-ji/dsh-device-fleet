# Inserts only this plugin's own row; no shipped DSH component is replaced.
#
# Zero-config by default: the token is borrowed from the spark-link pairing
# (~/.spark-link/state.json) and workers are found by multicast discovery.
# Set `token` here only to override the borrowed secret — when you do, use the
# identical value on every machine.
- insert:
    - id: device-fleet
      name: dsh-device-fleet
      config:
        role: worker+controller
        host: 0.0.0.0
        port: 48791
        token: ""
        workers: []
